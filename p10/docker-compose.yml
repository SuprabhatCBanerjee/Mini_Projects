version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: hiring_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: hiring_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - resumes_data:/data/resumes
    depends_on:
      - mongo

  ui:
    build: ./ui
    container_name: hiring_ui
    ports:
      - "8501:8501"
    depends_on:
      - mongo

volumes:
    mongo_data:
    resumes_data:
